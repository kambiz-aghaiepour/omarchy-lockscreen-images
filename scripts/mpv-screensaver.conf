# Screensaver drift mpv: deliberate input dismisses the screensaver. The
# idle-service also kills it on any activity; these binds cover the first
# seconds and direct keypresses while the player has focus. Commented lines
# pass through to mpv defaults.
ESC quit
SPACE quit
ENTER quit
# q quits (mpv default); keep the rest of mpv's defaults for playback keys.
PGUP quit
PGDWN quit
BS quit
# This player *is* the screensaver. Inhibiting idle makes hypridle see an
# immediate resume right after the launch, which used to cancel the lock.
stop-screensaver=no
